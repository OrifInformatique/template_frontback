version: '3.8'
 
services:
  mariadb:
    image: mariadb:latest
    container_name: fcc-SB-mariadb
    environment:
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: pwd
      MYSQL_ROOT_PASSWORD: pwd
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
 
volumes:
  mariadb_data: